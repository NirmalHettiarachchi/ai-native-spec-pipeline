[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-native-spec-pipeline"
version = "0.1.0"
description = "Prototype AI-native, spec-driven development pipeline with deterministic governance controls."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.7",
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["pipeline*", "demo_app*"]
where = [".", "demo_app/src"]

[tool.pytest.ini_options]
pythonpath = [".", "demo_app/src"]
testpaths = ["tests", "demo_app/tests"]
markers = [
  "acceptance: tests mapped to feature acceptance criteria",
  "integration: cross-component workflow tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true

