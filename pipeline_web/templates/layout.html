<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spec Pipeline Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="{{ url_for('static', path='/app.js') }}" defer></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
      <div class="container-fluid px-3 px-md-4">
        <a class="navbar-brand fw-bold" href="/">Spec Pipeline</a>
        <span class="navbar-text text-white-50">
          Governed AI-assisted development runs
        </span>
      </div>
    </nav>
    <main class="container-fluid px-3 px-md-4 py-4">
      {% block content %}{% endblock %}
    </main>
    <div class="loading-overlay" data-loading-overlay aria-live="polite" aria-hidden="true">
      <div class="loading-box card shadow-sm border-0">
        <div class="card-body d-flex align-items-center gap-3">
          <span class="spinner-border text-primary" aria-hidden="true"></span>
          <span class="fw-semibold" data-loading-message>Working...</span>
        </div>
      </div>
    </div>
  </body>
</html>
