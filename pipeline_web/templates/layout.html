<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spec Pipeline Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
    <script src="{{ url_for('static', path='/app.js') }}" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">Spec Pipeline</a>
      <span class="subtitle">Governed AI-assisted development runs</span>
    </header>
    <main class="page">
      {% if message %}
        <div class="notice success">{{ message }}</div>
      {% endif %}
      {% if error %}
        <div class="notice error">{{ error }}</div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
    <div class="loading-overlay" data-loading-overlay aria-live="polite" aria-hidden="true">
      <div class="loading-box">
        <span class="spinner" aria-hidden="true"></span>
        <span data-loading-message>Working...</span>
      </div>
    </div>
  </body>
</html>
